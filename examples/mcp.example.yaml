# MCP 服务器配置完整示例
# 复制到 ~/.openaide/config.yaml 的顶层（与 server/llm 同级），或参考合并进现有配置。
#
# 字段说明（internal/config/config.go: MCPConfig / MCPServerEntry）:
#   mcp.enabled:  总开关，false 时忽略整个 mcp 段
#   servers[].id:     唯一标识；工具注册进 LLM 时带 mcp_ 前缀，如 mcp_github_*
#   servers[].type:   "stdio"（默认）或 "sse"
#   servers[].command: stdio 必填，本地启动命令
#   servers[].args:    命令参数
#   servers[].url:     sse 必填，远程 HTTP 端点
#   servers[].env:     传给 stdio 子进程的环境变量
#
# 连接失败只记录 warning 并跳过，不影响服务启动。
mcp:
  enabled: true
  servers:
    # 方式 A: stdio —— 本地进程（推荐用于 npx 型官方 MCP server）
    - id: github
      type: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-github"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "ghp_替换为你的token"

    # 方式 B: sse —— 远程 HTTP 服务
    - id: my-service
      type: sse
      url: "https://mcp.example.com/message"

    # 本地自研 MCP server（编译好的二进制）
    - id: demo
      type: stdio
      command: /usr/local/bin/my-mcp-server
      args: []
      env: {}

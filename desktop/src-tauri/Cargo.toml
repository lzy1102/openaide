[package]
name = "openaide-desktop"
version = "0.3.1"
edition = "2021"
description = "OpenAIDE desktop shell — everything is a plugin"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

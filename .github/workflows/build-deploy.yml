name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  # ── 测试：TypeScript monorepo（npm workspaces）──
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # ── 发布：tag v* 时按依赖顺序发布全部 workspace 包 + 创建 Release ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Install
        run: npm ci
      - name: Publish packages (dependency order, source form via tsx)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs --no-tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ── 二进制：tag v* 时交叉编译三平台单文件可执行，附加到同一 Release ──
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (node_modules for workspace resolution)
        run: npm ci
      - name: Build single-file binaries (cross-compile)
        run: |
          V="${GITHUB_REF_NAME#v}"
          bun build packages/cli/src/main.ts --compile \
            --define "OPENAIDE_VERSION=\"$V\"" \ --define OPENAIDE_BINARY=true
            --target=bun-windows-x64 --outfile "dist-bun/openaide-$V-windows-x64.exe"
          bun build packages/cli/src/main.ts --compile \
            --define "OPENAIDE_VERSION=\"$V\"" \ --define OPENAIDE_BINARY=true
            --target=bun-linux-x64 --outfile "dist-bun/openaide-$V-linux-x64"
          bun build packages/cli/src/main.ts --compile \
            --define "OPENAIDE_VERSION=\"$V\"" \ --define OPENAIDE_BINARY=true
            --target=bun-darwin-arm64 --outfile "dist-bun/openaide-$V-darwin-arm64"
      - name: Attach binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bun/openaide-*

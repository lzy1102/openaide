name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GO_VERSION: "1.25"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Backend
        run: |
          cd backend
          CGO_ENABLED=0 go build -ldflags "-s -w" -o ../dist/bin/openaide-server ./src

      - name: Build CLI
        run: |
          cd terminal
          CGO_ENABLED=0 go build -ldflags "-s -w" -o ../dist/bin/openaide .

      - name: Package
        run: |
          mkdir -p dist/data/{database,knowledge,uploads}
          cp .openaide.example dist/ 2>/dev/null || true
          cp -r frontend dist/frontend 2>/dev/null || true
          cp scripts/install.sh dist/ 2>/dev/null || true
          cp scripts/uninstall.sh dist/ 2>/dev/null || true
          chmod +x dist/install.sh dist/uninstall.sh 2>/dev/null || true
          tar -czvf openaide-linux-amd64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: openaide-linux-amd64
          path: openaide-linux-amd64.tar.gz

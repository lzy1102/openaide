name: Build and Test

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build All Platforms
        run: cd backend && mkdir -p cmd/server/frontend && touch cmd/server/frontend/.gitkeep && make build-all

      - name: Test
        run: cd backend && go test -short ./internal/...

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/openaide*
          generate_release_notes: true

name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目标'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - production
          - staging

env:
  GO_VERSION: "1.26"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Server
        run: |
          cd backend
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../dist/bin/openaide-server ./cmd/server

      - name: Build CLI
        run: |
          cd backend
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../dist/bin/openaide-cli ./cmd/cli

      - name: Run Tests
        run: |
          cd backend
          go test ./internal/...

      - name: Package Release
        run: |
          mkdir -p dist/data dist/scripts

          # 复制二进制文件
          chmod +x dist/bin/openaide-server dist/bin/openaide-cli
          ln -sf openaide-cli dist/bin/openaide

          # 复制安装脚本
          cp install.sh dist/
          cp scripts/update.sh dist/scripts/
          cp uninstall.sh dist/scripts/

          # 复制配置示例
          cp backend/config.example.yaml dist/
          cp backend/config.example.json dist/

          # 创建版本信息
          echo "${{ github.ref_name }}" > dist/VERSION
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_TIME
          echo "${{ github.sha }}" > dist/COMMIT

          # 打包
          tar -czvf openaide-linux-amd64.tar.gz -C dist .

          # 创建 install.sh 可直接执行的包（自解压）
          cat > openaide-installer.sh << 'INSTALLER_EOF'
#!/bin/bash
# OpenAIDE 自解压安装脚本
# 用法: bash openaide-installer.sh

set -e

INSTALL_DIR="${INSTALL_DIR:-$HOME/.openaide}"
TEMP_DIR="/tmp/openaide-install-$$"

# 颜色
RED='\033[0;31m'
GREEN='\033[0;32m'
YELLOW='\033[1;33m'
BLUE='\033[0;34m'
NC='\033[0m'

echo -e "${BLUE}[INFO]${NC} 解压安装包..."
mkdir -p "$TEMP_DIR"

# 从脚本尾部提取 tar 包
ARCHIVE_START=$(awk '/^__ARCHIVE_START__/ {print NR + 1; exit 0}' "$0")
tail -n +$ARCHIVE_START "$0" | tar -xzf - -C "$TEMP_DIR"

echo -e "${BLUE}[INFO]${NC} 运行安装..."
cd "$TEMP_DIR"
bash install.sh "$@"

echo -e "${BLUE}[INFO]${NC} 清理..."
rm -rf "$TEMP_DIR"

exit 0

__ARCHIVE_START__
INSTALLER_EOF

          # 追加 tar 包到 installer
          cat openaide-linux-amd64.tar.gz >> openaide-installer.sh
          chmod +x openaide-installer.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openaide-linux-amd64
          path: |
            openaide-linux-amd64.tar.gz
            openaide-installer.sh

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            openaide-linux-amd64.tar.gz
            openaide-installer.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_target != 'none' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: openaide-linux-amd64

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ secrets.DEPLOY_PORT || 22 }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      - name: Deploy to Server
        run: |
          # 上传自解压安装包
          scp -F ~/.ssh/config openaide-installer.sh deploy:/tmp/

          # 执行远程更新
          ssh -F ~/.ssh/config deploy << 'REMOTE'
            set -e
            INSTALL_DIR="${INSTALL_DIR:-$HOME/.openaide}"
            BACKUP_DIR="$INSTALL_DIR/.backup-$(date +%Y%m%d-%H%M%S)"

            echo "[INFO] 备份当前版本..."
            mkdir -p "$BACKUP_DIR"
            cp -r "$INSTALL_DIR/bin" "$BACKUP_DIR/" 2>/dev/null || true

            echo "[INFO] 执行安装..."
            cd /tmp
            bash openaide-installer.sh --local || bash openaide-installer.sh

            echo "[INFO] 重启服务..."
            if [ -f "$INSTALL_DIR/openaide.pid" ]; then
              PID=$(cat "$INSTALL_DIR/openaide.pid")
              if kill -0 "$PID" 2>/dev/null; then
                kill "$PID"
                sleep 2
              fi
            fi

            # 启动新版本
            cd "$INSTALL_DIR"
            nohup "$INSTALL_DIR/bin/openaide-server" -config "$INSTALL_DIR/config.yaml" > "$INSTALL_DIR/logs/server.log" 2>&1 &
            echo $! > "$INSTALL_DIR/openaide.pid"

            echo "[OK] 部署完成!"
            echo "[INFO] PID: $(cat $INSTALL_DIR/openaide.pid)"
          REMOTE

          # 清理
          rm -f /tmp/openaide-installer.sh

      - name: Health Check
        run: |
          sleep 5
          ssh -F ~/.ssh/config deploy "curl -fsS http://localhost:8080/health || echo 'Health check failed'"

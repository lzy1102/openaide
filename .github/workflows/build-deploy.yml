name: Build and Test

on:
  push:
    tags: ['v*']

jobs:
  # ── Server + CLI (static, CGO_ENABLED=0, all platforms) ──
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build All Platforms
        run: cd backend && mkdir -p cmd/server/frontend && touch cmd/server/frontend/.gitkeep && make build-all

      - name: Test
        run: cd backend && go test -short ./internal/...

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/openaide*
          generate_release_notes: true

  # ── Desktop App (Wails v2, per-platform installer) ──
  build-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
            deps: libgtk-3-dev libwebkit2gtk-4.0-dev
          - os: macos-latest
            name: darwin
            ext: ""
            deps: ""
          - os: windows-latest
            name: windows
            ext: .exe
            deps: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Setup Frontend
        run: |
          mkdir -p frontend-desktop/node_modules
          echo '{"name":"openaide-desktop","private":true}' > frontend-desktop/package.json

      - name: Package Desktop (${{ matrix.name }})
        run: |
          wails build -platform ${{ matrix.name }}/amd64 -o bin/openaide-desktop-${{ matrix.name }}-amd64${{ matrix.ext }}

      - name: Upload Desktop Artifact
        uses: softprops/action-gh-release@v1
        with:
          files: bin/openaide-desktop-${{ matrix.name }}*
          generate_release_notes: true

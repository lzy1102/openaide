name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  # ── 测试：TypeScript monorepo（npm workspaces）──
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # ── 发布：tag v* 时按依赖顺序发布全部 workspace 包 + 创建 Release ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Install
        run: npm ci
      - name: Publish packages (dependency order, source form via tsx)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs --no-tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ── 二进制：tag v* 时交叉编译三平台单文件可执行，附加到同一 Release ──
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (node_modules for workspace resolution)
        run: npm ci
      - name: Build single-file binaries (cross-compile)
        run: |
          V="${GITHUB_REF_NAME#v}"
          bun build packages/cli/src/main.ts --compile \
            --define "OPENAIDE_VERSION=\"$V\"" --define OPENAIDE_BINARY=true \
            --target=bun-windows-x64 --outfile "dist-bun/openaide-$V-windows-x64.exe"
          bun build packages/cli/src/main.ts --compile \
            --define "OPENAIDE_VERSION=\"$V\"" --define OPENAIDE_BINARY=true \
            --target=bun-linux-x64 --outfile "dist-bun/openaide-$V-linux-x64"
          bun build packages/cli/src/main.ts --compile \
            --define "OPENAIDE_VERSION=\"$V\"" --define OPENAIDE_BINARY=true \
            --target=bun-darwin-arm64 --outfile "dist-bun/openaide-$V-darwin-arm64"
      - name: Attach binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bun/openaide-*

  # ── 桌面应用：Tauri 壳 + 内嵌 openaide 后端二进制 ──
  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: bun-windows-x64
            ext: .exe
          - os: ubuntu-latest
            target: bun-linux-x64
            ext: ''
          - os: macos-latest
            target: bun-darwin-arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install (root workspaces)
        run: npm ci
      - name: Linux webkit deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build openaide backend binary
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          bun build packages/cli/src/main.ts --compile             --define "OPENAIDE_VERSION=\"$V\"" --define OPENAIDE_BINARY=true             --target=${{ matrix.target }}             --outfile "dist-bun/openaide-backend${{ matrix.ext }}"
      - name: Place backend next to shell (sibling resolution)
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/target/release
          cp "dist-bun/openaide-backend${{ matrix.ext }}" "desktop/src-tauri/target/release/openaide${{ matrix.ext }}"
      - name: Install (desktop tauri cli)
        working-directory: desktop
        run: npm ci
      - name: Generate icon set
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Tauri build (bundles)
        working-directory: desktop
        run: npx tauri build
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb

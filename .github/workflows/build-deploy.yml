name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GO_VERSION: "1.26"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Server
        run: |
          cd backend
          CGO_ENABLED=0 go build -ldflags "-s -w" -o ../dist/bin/openaide-server ./cmd/server

      - name: Build CLI
        run: |
          cd backend
          CGO_ENABLED=0 go build -ldflags "-s -w" -o ../dist/bin/openaide-cli ./cmd/cli

      - name: Run Tests
        run: |
          cd backend
          go test ./internal/...

      - name: Package
        run: |
          mkdir -p dist/data
          tar -czvf openaide-linux-amd64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: openaide-linux-amd64
          path: openaide-linux-amd64.tar.gz

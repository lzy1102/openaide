name: Build and Test

on:
  push:
    tags: ['v*']

jobs:
  # ── Server + CLI (static, CGO_ENABLED=0, all platforms) ──
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build All Platforms
        run: cd backend && make build-all

      - name: Release (upload first — always)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/openaide*
          generate_release_notes: true

      - name: Test
        run: cd backend && go test -short ./internal/...

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: npm
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          npm pkg set version="$TAG"
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish --access public
          rm .npmrc

  # ── Desktop App (Wails v2, per-platform installer) ──
  build-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
            deps: libgtk-3-dev libwebkit2gtk-4.1-dev
          - os: macos-latest
            name: darwin
            ext: ""
            deps: ""
          - os: windows-latest
            name: windows
            ext: .exe
            deps: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}

      - name: Build Desktop Binary (${{ matrix.name }})
        working-directory: backend
        env:
          GOOS: ${{ matrix.name }}
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/openaide-desktop-${{ matrix.name }}-amd64${{ matrix.ext }} ./cmd/desktop

      - name: Package for macOS (create .app bundle)
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin/OpenAIDE.app/Contents/MacOS
          cp backend/bin/openaide-desktop-darwin-amd64 bin/OpenAIDE.app/Contents/MacOS/openaide
          cat > bin/OpenAIDE.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple Computer//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>OpenAIDE</string>
            <key>CFBundleExecutable</key><string>openaide</string>
            <key>CFBundleIdentifier</key><string>com.openaide.desktop</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
          </dict></plist>
          PLIST
          cd bin && zip -r openaide-desktop-darwin-amd64.zip OpenAIDE.app
        shell: bash

      - name: Package for Windows (zip)
        if: runner.os == 'Windows'
        run: |
          mkdir bin
          Compress-Archive -Path backend/bin/openaide-desktop-windows-amd64.exe -DestinationPath bin/openaide-desktop-windows-amd64.zip
        shell: powershell

      - name: Package for Linux (tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd backend/bin && tar -czf openaide-desktop-linux-amd64.tar.gz openaide-desktop-linux-amd64

      - name: Upload Desktop Artifact
        uses: softprops/action-gh-release@v1
        with:
          files: |
            backend/bin/openaide-desktop-${{ matrix.name }}*
            bin/openaide-desktop-${{ matrix.name }}*
          generate_release_notes: true

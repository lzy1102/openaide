server:
  host: "0.0.0.0"
  port: 8080

llm:
  default_provider: "deepseek"
  providers:
    - name: "deepseek"
      type: "openai"
      base_url: "https://api.deepseek.com/v1"
      api_key: "sk-请替换为你的API Key"    # ← 必填
      default_model: "deepseek-v4-pro"
      enabled: true

memory:
  data_dir: "~/.openaide/data/memory"

kernel:
  max_rounds: 10

storage:
  data_dir: "~/.openaide/data"

browser:
  enabled: false

# MCP Server 连接（可选，默认关闭）
# mcp:
#   enabled: true
#   servers:
#     - id: "playwright"
#       command: "npx"
#       args: ["@playwright/mcp"]
#     - id: "filesystem"
#       command: "npx"
#       args: ["@modelcontextprotocol/server-filesystem", "/tmp"]

log:
  level: "info"

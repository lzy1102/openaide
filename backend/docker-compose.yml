version: "3.8"

services:
  openaide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openaide-server
    restart: unless-stopped
    ports:
      - "${PORT:-19375}:19375"
    volumes:
      - openaide-data:/opt/openaide/data
      - openaide-logs:/opt/openaide/logs
      - ./config.json:/app/config.json:ro
    environment:
      - OPENAIDE_HOME=/opt/openaide
      - OPENAIDE_JWT_SECRET=${JWT_SECRET:-}
      - PORT=19375
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19375/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  openaide-data:
    driver: local
  openaide-logs:
    driver: local
